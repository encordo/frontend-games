    <!--
            Lectura de tres cartas
            ----------------------

            Este método es utilizado para conocer de manera rápida la energía actual de una persona y tomar consciencia sobre aspectos inadvertidos
            o posibles obstáculos en el futuro. Se colocan tres cartas boca abajo en fila. Su descubrimiento será de izquierda a derecha, representando cada una
            un momento en particular:

            Primera: pasado
            Segunda: presente
            Tercera: futuro

            Es recomendable anotar las primeras percepciones que se tienen al momento de girar cada una de las cartas.
            Muchas veces, lo primero que ocurre en la mente, se ve influenciado por la intuición, herramienta clave en las lecturas del tarot.
            
            Tirada de cinco cartas o cruz
            -----------------------------

            El nombre de esta variante se debe a la forma que toma cuando se baraja. Se encuentra orientada a tratar un problema en particular.
            Se deberán colocar cuatro cartas alrededor de una principal, formando la forma de una cruz.

            La disposición se da en sentido de la carta central, respetando el siguiente orden: izquierda, derecha, arriba, abajo y centro.
            Todas estas simbolizan:

            La carta de la izquierda: muestra lo positivo, las cualidades, los aspectos por los cuales el consultante puede sentirse agradecido. Asimismo, representa las fortalezas de la situación por la cual se realiza la consulta.
            La carta de la derecha habla de las desventajas, problemas o situaciones difíciles.
            La carta de arriba analiza de la forma más objetiva el conflicto y el pasado de tal.
            La carta del centro muestra la conclusión, determinación o resolución de la consulta.
            La carta de abajo muestra una proyección del futuro, en relación a la carta del centro.

            Lectura de nueve cartas de tarot
            --------------------------------

            Una de las sesiones más completas de tarot, incluye una tirada de nueve cartas. Su interpretación se guía en un orden determinado,
            asignando a cada figura un significado en particular. En esta lectura, se escogen las cartas y se ordenan en tres filas, de tres cartas cada una.
            Se organiza el análisis de izquierda a derecha, con la siguiente simbología:

            Primera: el presente del consultante, su individualidad y la percepción sobre sí mismo.
            Segunda: conflictos, problemas, dudas, cuestionamientos o incertidumbres, orientados al verdadero motivo de la consulta al tarot.
            Tercera: señala el origen, los motivos o situaciones que provocaron la situación que señala la carta anterior.
            Cuarta: representa el pasado de la persona, desde un punto de vista general.
            Quinta: muestra las debilidades del individuo, especialmente aplicadas al tema a consultar.
            Sexta: son los puntos fuertes, la oportunidad y capacidades que posee para resolver sus problemas y lograr lo que desea.
            Séptima: instruye los elementos y decisiones a tomar para conseguir lo que se desea y solucionar lo que se deba.
            Octava: refuerza la carta anterior y señala las aptitudes mentales y espirituales del consultante para conseguir su objetivo.
            Novena: es una carta de cierre y conclusión, que muchas veces señala un posible futuro.
        -->
